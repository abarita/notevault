// === RESIZERS ===
function initResizers(){
  var sidebar=document.getElementById("sidebar");
  var sidebarResizer=document.getElementById("sidebarResizer");
  var editorPane=document.getElementById("editorPane");
  var contentResizer=document.getElementById("contentResizer");
  var contentArea=document.querySelector(".content-area");

  try{
    var savedSidebarW=localStorage.getItem("notevault_sidebar_width");
    if(savedSidebarW){
      var sw=parseInt(savedSidebarW,10);
      if(sw>=180&&sw<=600)sidebar.style.width=sw+"px";
    }
    var savedEditorRatio=localStorage.getItem("notevault_editor_ratio");
    if(savedEditorRatio){
      var er=parseFloat(savedEditorRatio);
      if(er>=15&&er<=85)editorPane.style.width=er+"%";
    }
  }catch(e){}

  if(sidebarResizer&&sidebar){
    sidebarResizer.addEventListener("mousedown",function(e){
      if(e.button!==0)return;
      e.preventDefault();
      document.body.style.cursor="col-resize";
      document.body.style.userSelect="none";
      sidebarResizer.classList.add("resizing");

      function onMouseMove(ev){
        var w=ev.clientX;
        if(w<180)w=180;
        if(w>600)w=600;
        sidebar.style.width=w+"px";
      }

      function onMouseUp(){
        document.body.style.cursor="";
        document.body.style.userSelect="";
        sidebarResizer.classList.remove("resizing");
        window.removeEventListener("mousemove",onMouseMove);
        window.removeEventListener("mouseup",onMouseUp);
        try{localStorage.setItem("notevault_sidebar_width",parseInt(sidebar.style.width,10));}catch(e){}
      }

      window.addEventListener("mousemove",onMouseMove);
      window.addEventListener("mouseup",onMouseUp);
    });

    sidebarResizer.addEventListener("dblclick",function(){
      sidebar.style.width="300px";
      try{localStorage.removeItem("notevault_sidebar_width");}catch(e){}
    });
  }

  if(contentResizer&&editorPane&&contentArea){
    contentResizer.addEventListener("mousedown",function(e){
      if(e.button!==0)return;
      e.preventDefault();
      document.body.style.cursor="col-resize";
      document.body.style.userSelect="none";
      contentResizer.classList.add("resizing");

      function onMouseMove(ev){
        var rect=contentArea.getBoundingClientRect();
        if(rect.width<=0)return;
        var offsetX=ev.clientX-rect.left;
        var pct=(offsetX/rect.width)*100;
        if(pct<15)pct=15;
        if(pct>85)pct=85;
        editorPane.style.width=pct.toFixed(2)+"%";
      }

      function onMouseUp(){
        document.body.style.cursor="";
        document.body.style.userSelect="";
        contentResizer.classList.remove("resizing");
        window.removeEventListener("mousemove",onMouseMove);
        window.removeEventListener("mouseup",onMouseUp);
        try{
          var val=parseFloat(editorPane.style.width);
          if(val)localStorage.setItem("notevault_editor_ratio",val);
        }catch(e){}
      }

      window.addEventListener("mousemove",onMouseMove);
      window.addEventListener("mouseup",onMouseUp);
    });

    contentResizer.addEventListener("dblclick",function(){
      editorPane.style.width="50%";
      try{localStorage.removeItem("notevault_editor_ratio");}catch(e){}
    });
  }
}

// === SYNCHRONIZED SCROLLING ===
var syncScrollEnabled=localStorage.getItem("notevault_sync_scroll")!=="false";
var isProgrammaticScrollEditor=false;
var isProgrammaticScrollPreview=false;

function updateSyncScrollButton(){
  var btn=document.getElementById("syncScrollBtn");
  if(!btn)return;
  if(syncScrollEnabled){
    btn.style.color="var(--accent)";
    btn.style.borderColor="var(--accent)";
    btn.title="Synchronized Scrolling: ON (Click to disable)";
    btn.innerHTML="&#128279; Sync Scroll";
  }else{
    btn.style.color="var(--text3)";
    btn.style.borderColor="var(--border)";
    btn.title="Synchronized Scrolling: OFF (Click to enable)";
    btn.innerHTML="&#128279; <span style='text-decoration:line-through;'>Sync Scroll</span>";
  }
}

function toggleSyncScroll(){
  syncScrollEnabled=!syncScrollEnabled;
  try{localStorage.setItem("notevault_sync_scroll",syncScrollEnabled?"true":"false");}catch(e){}
  updateSyncScrollButton();
  var openModal=document.getElementById("modalContainer");
  if(openModal&&openModal.innerHTML.includes("Settings")){
    openSettings();
  }
  showToast(syncScrollEnabled?"Synchronized scrolling ON":"Synchronized scrolling OFF");
}

function initSyncScroll(){
  var editor=document.getElementById("editor");
  var preview=document.getElementById("preview");
  if(!editor||!preview)return;

  editor.addEventListener("scroll",function(){
    if(!syncScrollEnabled)return;
    if(isProgrammaticScrollEditor){
      isProgrammaticScrollEditor=false;
      return;
    }

    var maxEditor=editor.scrollHeight-editor.clientHeight;
    if(maxEditor<=0)return;

    var ratio=editor.scrollTop/maxEditor;
    var maxPreview=preview.scrollHeight-preview.clientHeight;
    if(maxPreview>0){
      isProgrammaticScrollPreview=true;
      preview.scrollTop=ratio*maxPreview;
    }
  },{passive:true});

  preview.addEventListener("scroll",function(){
    if(!syncScrollEnabled)return;
    if(isProgrammaticScrollPreview){
      isProgrammaticScrollPreview=false;
      return;
    }

    var maxPreview=preview.scrollHeight-preview.clientHeight;
    if(maxPreview<=0)return;

    var ratio=preview.scrollTop/maxPreview;
    var maxEditor=editor.scrollHeight-editor.clientHeight;
    if(maxEditor>0){
      isProgrammaticScrollEditor=true;
      editor.scrollTop=ratio*maxEditor;
    }
  },{passive:true});

  updateSyncScrollButton();
}

// === MOBILE VIEW SWITCHER ===
var mobileViewMode=localStorage.getItem("notevault_mobile_view")||"split";

function setMobileView(mode){
  mobileViewMode=mode;
  try{localStorage.setItem("notevault_mobile_view",mode);}catch(e){}
  applyMobileView();
}

function applyMobileView(){
  var isMobile=window.innerWidth<=768;
  var ep=document.getElementById("editorPane");
  var pp=document.getElementById("previewPane");
  var tEdit=document.getElementById("tabEditBtn");
  var tPrev=document.getElementById("tabPreviewBtn");
  var tSplit=document.getElementById("tabSplitBtn");

  if(!isMobile){
    if(ep){ep.style.display="flex";ep.style.height="";ep.style.width=localStorage.getItem("notevault_editor_ratio")?(localStorage.getItem("notevault_editor_ratio")+"%"):"50%";}
    if(pp){pp.style.display="flex";pp.style.height="";pp.style.width="";}
    return;
  }

  if(tEdit)tEdit.classList.toggle("active",mobileViewMode==="edit");
  if(tPrev)tPrev.classList.toggle("active",mobileViewMode==="preview");
  if(tSplit)tSplit.classList.toggle("active",mobileViewMode==="split");

  if(!ep||!pp)return;
  if(mobileViewMode==="edit"){
    ep.style.display="flex";
    ep.style.width="100%";
    ep.style.height="100%";
    pp.style.display="none";
  }else if(mobileViewMode==="preview"){
    ep.style.display="none";
    pp.style.display="flex";
    pp.style.width="100%";
    pp.style.height="100%";
  }else{ // split
    ep.style.display="flex";
    ep.style.width="100%";
    ep.style.height="50%";
    pp.style.display="flex";
    pp.style.width="100%";
    pp.style.height="50%";
  }
}
window.addEventListener("resize",applyMobileView);

// === INIT ===
async function init(){await openDB();await initTheme();initResizers();initSyncScroll();applyMobileView();var autoSync=await dbGet("settings","auto_sync");if(autoSync)syncEnabled=autoSync.value;
  if(location.protocol!=="file:"){if("serviceWorker"in navigator){try{await navigator.serviceWorker.register("sw.js");}catch(e){}}}
  var setup=await isSetup();
  if(!setup){await showSetup();}else{await showUnlock();}
  document.addEventListener("click",function(e){if(e.button!==0)return;var menu=document.getElementById("contextMenu");
    if(menu&&!menu.contains(e.target))menu.style.display="none";});
  document.getElementById("folderTree").addEventListener("contextmenu",function(e){
    var noteEl=e.target.closest("[data-note]");var folderEl=e.target.closest("[data-folder]");
    if(noteEl){noteContext(e,noteEl.getAttribute("data-note"));}
    else if(folderEl){folderContext(e,folderEl.getAttribute("data-folder"));}
    else{rootFolderContext(e);}
  });
  var edEl=document.getElementById("editor");
  if(edEl){
    edEl.addEventListener("blur",function(){
      if(currentNoteId){
        saveCurrentNote();
        if(syncEnabled&&githubToken&&gistId&&!syncInProgress){
          clearTimeout(autoSyncTimer);
          manualSync();
        }
      }
    });
  }
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="hidden"&&currentNoteId){
      saveCurrentNote();
      if(syncEnabled&&githubToken&&gistId&&!syncInProgress){
        clearTimeout(autoSyncTimer);
        manualSync();
      }
    }
  });
}
