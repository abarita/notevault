<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NoteVault</title>
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22NoteVault%22%2C%22short_name%22%3A%22NoteVault%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%231e1e2e%22%2C%22theme_color%22%3A%22%231e1e2e%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%253Crect%20width%3D'100'%20height%3D'100'%20rx%3D'20'%20fill%3D'%23282840'%2F%3E%253Ctext%20x%3D'50'%20y%3D'65'%20text-anchor%3D'middle'%20font-size%3D'50'%20fill%3D'%2389b4fa'%20font-family%3D'sans-serif'%3EN%253C%2Ftext%3E%253C%2Fsvg%3E%22%2C%22sizes%22%3A%22100x100%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
:root, [data-theme="dark"] {
  --bg: #1e1e2e; --surface: #282840; --surface2: #313150; --surface3: #3a3a5c;
  --text: #cdd6f4; --text2: #a6adc8; --text3: #6c7086;
  --accent: #89b4fa; --accent2: #b4befe; --border: #45475a;
  --danger: #f38ba8; --green: #a6e3a1; --warning: #f9e2af; --orange: #fab387;
  --json-key: #89b4fa; --json-string: #a6e3a1; --json-number: #fab387;
  --json-bool: #cba6f7; --json-null: #6c7086; --json-bracket: #6c7086;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --overlay: rgba(0,0,0,0.5);
}
[data-theme="light"] {
  --bg: #f5f5f9; --surface: #ffffff; --surface2: #f0f0f5; --surface3: #e5e5ee;
  --text: #1e1e2e; --text2: #585b70; --text3: #9ca0b0;
  --accent: #1e66f5; --accent2: #2e7af9; --border: #d0d0da;
  --danger: #d20f39; --green: #40a02b; --warning: #df8e1d; --orange: #fe640b;
  --json-key: #1e66f5; --json-string: #40a02b; --json-number: #fe640b;
  --json-bool: #8839ef; --json-null: #9ca0b0; --json-bracket: #9ca0b0;
  --shadow: 0 2px 12px rgba(0,0,0,0.1);
  --overlay: rgba(0,0,0,0.3);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; overflow: hidden; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.sidebar { width: 300px; min-width: 300px; background: var(--surface); display: flex; flex-direction: column; border-right: 1px solid var(--border); z-index: 10; transition: transform 0.25s ease; }
.sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sidebar-header h1 { font-size: 17px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.btn { background: var(--accent); color: var(--bg); border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: opacity 0.15s; white-space: nowrap; min-height: 36px; display: inline-flex; align-items: center; gap: 4px; font-family: inherit; }
.btn:hover { opacity: 0.85; }
.btn:active { opacity: 0.7; }
.btn-sm { padding: 5px 10px; font-size: 12px; min-height: 30px; }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface2); }
.btn-danger { background: var(--danger); }
.btn-icon { background: transparent; border: none; color: var(--text2); cursor: pointer; padding: 4px 6px; border-radius: 4px; font-size: 15px; line-height: 1; min-height: 30px; min-width: 30px; display: inline-flex; align-items: center; justify-content: center; }
.btn-icon:hover { background: var(--surface2); color: var(--text); }
.folder-tree { flex: 1; overflow-y: auto; padding: 8px 4px; }
.tree-item { display: flex; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; transition: background 0.1s; gap: 4px; font-size: 13px; user-select: none; border: 1px solid transparent; margin: 1px 0; min-height: 36px; }
.tree-item:hover { background: var(--surface2); }
.tree-item.active { background: var(--surface2); border-color: var(--accent); }
.tree-arrow { width: 18px; text-align: center; color: var(--text3); font-size: 10px; flex-shrink: 0; cursor: pointer; min-height: 24px; display: flex; align-items: center; justify-content: center; }
.tree-arrow:hover { color: var(--text); }
.tree-icon { opacity: 0.6; font-size: 14px; flex-shrink: 0; }
.tree-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-time { display: block; font-size: 10px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.tree-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--surface3); text-transform: uppercase; letter-spacing: 0.5px; color: var(--text2); flex-shrink: 0; }
.tree-actions { display: none; gap: 2px; flex-shrink: 0; }
.tree-item:hover .tree-actions { display: flex; }
.tree-children { padding-left: 16px; }
.tree-children.collapsed { display: none; }
.context-menu { position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px; z-index: 1000; box-shadow: var(--shadow); min-width: 160px; display: none; }
.context-menu-item { padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; color: var(--text); }
.context-menu-item:hover { background: var(--surface2); }
.context-menu-item.danger { color: var(--danger); }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.toolbar { padding: 8px 14px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--surface); min-height: 48px; }
.toolbar select { background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer; font-family: inherit; min-height: 34px; }
.toolbar select:focus { outline: none; border-color: var(--accent); }
.toolbar-spacer { flex: 1; }
.content-area { flex: 1; display: flex; min-height: 0; }
.editor-pane, .preview-pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.editor-pane { border-right: 1px solid var(--border); }
.pane-header { padding: 6px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); border-bottom: 1px solid var(--border); background: var(--surface); display: flex; justify-content: space-between; align-items: center; min-height: 30px; }
.editor-pane textarea { flex: 1; background: var(--bg); color: var(--text); border: none; padding: 16px; font-family: 'Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace; font-size: 14px; line-height: 1.65; resize: none; outline: none; tab-size: 2; }
.preview-content { flex: 1; overflow-y: auto; padding: 16px; line-height: 1.7; }
.preview-content h1,.preview-content h2,.preview-content h3 { color: var(--accent); margin: 16px 0 8px; }
.preview-content h1 { font-size: 22px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
.preview-content h2 { font-size: 18px; }
.preview-content h3 { font-size: 15px; }
.preview-content p { margin: 8px 0; }
.preview-content a { color: var(--accent2); }
.preview-content code { background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-family: 'Cascadia Code','Fira Code','Consolas',monospace; font-size: 13px; }
.preview-content pre { background: var(--surface); padding: 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; border: 1px solid var(--border); }
.preview-content pre code { background: none; padding: 0; }
.preview-content blockquote { border-left: 3px solid var(--accent); padding-left: 16px; color: var(--text2); margin: 12px 0; }
.preview-content table { border-collapse: collapse; width: 100%; margin: 12px 0; }
.preview-content th,.preview-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
.preview-content th { background: var(--surface); }
.preview-content ul,.preview-content ol { padding-left: 24px; margin: 8px 0; }
.preview-content li { margin: 4px 0; }
.preview-content hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.xml-key { color: var(--json-key); } .xml-string { color: var(--json-string); }
.xml-bracket { color: var(--json-bracket); } .xml-attr { color: var(--warning); }
.text-block { white-space: pre-wrap; font-family: inherit; }
.mermaid-rendered { overflow-x: auto; padding: 16px 0; display: flex; justify-content: center; }
.mermaid-rendered svg { max-width: 100%; }
.json-tree { font-family: 'Cascadia Code','Fira Code','Consolas',monospace; font-size: 13px; }
.json-node { padding-left: 20px; }
.json-line { display: flex; align-items: flex-start; min-height: 22px; line-height: 1.6; }
.json-toggle { cursor: pointer; width: 16px; flex-shrink: 0; color: var(--text3); user-select: none; font-size: 11px; text-align: center; margin-right: 2px; }
.json-toggle:hover { color: var(--text); }
.json-key-name { color: var(--json-key); margin-right: 4px; flex-shrink: 0; }
.json-colon { margin-right: 4px; color: var(--text3); }
.json-val-string { color: var(--json-string); }
.json-val-number { color: var(--json-number); }
.json-val-bool { color: var(--json-bool); }
.json-val-null { color: var(--json-null); font-style: italic; }
.json-bracket { color: var(--json-bracket); }
.json-preview { color: var(--text3); font-style: italic; cursor: pointer; }
.json-copy-path { opacity: 0; font-size: 10px; color: var(--text3); cursor: pointer; margin-left: 4px; padding: 0 4px; border-radius: 3px; flex-shrink: 0; }
.json-line:hover .json-copy-path { opacity: 1; }
.json-copy-path:hover { background: var(--surface2); color: var(--accent); }
.json-filter-bar { padding: 8px 0; border-bottom: 1px solid var(--border); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.json-filter-bar input { flex: 1; background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 5px 10px; border-radius: 6px; font-size: 12px; font-family: 'Cascadia Code','Fira Code','Consolas',monospace; outline: none; }
.json-filter-bar input:focus { border-color: var(--accent); }
.json-filter-bar .filter-count { font-size: 11px; color: var(--text2); white-space: nowrap; }
.json-node.hidden { display: none; }
.json-node.match-highlight .json-key-name { background: rgba(137,180,250,0.3); border-radius: 2px; }
.json-val-string mark, .json-val-number mark, .json-key-name mark { background: var(--warning); color: var(--bg); border-radius: 2px; padding: 0 1px; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text2); text-align: center; padding: 32px; }
.empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-state h2 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: 14px; max-width: 400px; }
.stats { padding: 10px 16px; font-size: 11px; color: var(--text2); border-top: 1px solid var(--border); }
.toast { position: fixed; bottom: 24px; right: 24px; background: var(--green); color: var(--bg); padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; opacity: 0; transform: translateY(10px); transition: all 0.2s; pointer-events: none; z-index: 200; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.error { background: var(--danger); }
.hamburger { display: none; background: none; border: none; color: var(--text); cursor: pointer; font-size: 22px; padding: 4px 8px; border-radius: 6px; min-height: 40px; min-width: 40px; align-items: center; justify-content: center; }
.hamburger:hover { background: var(--surface2); }
.modal-overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 300; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; padding: 24px; max-width: 480px; width: 100%; box-shadow: var(--shadow); border: 1px solid var(--border); }
.modal h2 { font-size: 18px; margin-bottom: 12px; color: var(--accent); }
.modal p { font-size: 14px; color: var(--text2); margin-bottom: 16px; line-height: 1.5; }
.modal input[type="text"], .modal input[type="password"], .modal textarea { width: 100%; padding: 10px 14px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; margin-bottom: 12px; font-family: 'Cascadia Code','Fira Code','Consolas',monospace; outline: none; }
.modal input:focus, .modal textarea:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.recovery-words { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 16px 0; }
.recovery-word { background: var(--surface2); padding: 8px 12px; border-radius: 6px; font-size: 13px; font-family: 'Cascadia Code','Fira Code','Consolas',monospace; text-align: center; border: 1px solid var(--border); }
.recovery-word .index { font-size: 10px; color: var(--text3); display: block; }
.settings-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.settings-row label { color: var(--text2); }
.sync-indicator { font-size: 11px; display: flex; align-items: center; gap: 4px; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; }
.sync-dot.synced { background: var(--green); }
.sync-dot.syncing { background: var(--warning); animation: pulse 1s infinite; }
.sync-dot.error { background: var(--danger); }
.sync-dot.never { background: var(--text3); }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
.search-input { background: var(--surface2); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; font-size: 13px; width: 140px; outline: none; font-family: inherit; }
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text3); }
@media (max-width: 768px) {
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; transform: translateX(-100%); width: 85vw; max-width: 320px; }
  .sidebar.open { transform: translateX(0); }
  .hamburger { display: flex; }
  .content-area { flex-direction: column; }
  .editor-pane { border-right: none; border-bottom: 1px solid var(--border); flex: none; height: 45%; }
  .preview-pane { flex: 1; }
  .toolbar { gap: 4px; padding: 6px 10px; }
  .toolbar select { font-size: 12px; padding: 4px 8px; min-height: 30px; }
  .btn-sm { padding: 4px 8px; font-size: 11px; min-height: 28px; }
  .search-input { width: 100px; font-size: 12px; }
  .recovery-words { grid-template-columns: repeat(2,1fr); }
  .modal { padding: 16px; }
}
.mobile-backdrop { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 49; }
@media (max-width: 768px) { .mobile-backdrop.open { display: block; } }
</style>
</head>
<body>

<div class="mobile-backdrop" id="mobileBackdrop" onclick="closeSidebar()"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h1>NoteVault</h1>
    <div style="display:flex;gap:4px;">
      <button class="btn-icon" onclick="openSettings()" title="Settings">&#9881;</button>
      <button class="btn btn-sm btn-ghost" onclick="createRootFolder()" title="New folder">&#128193;+</button>
      <button class="btn btn-sm" onclick="createNote()">+ New</button>
    </div>
  </div>
  <div style="padding:6px 8px;">
    <input class="search-input" id="searchInput" placeholder="Search..." oninput="onSearch()" style="width:100%;">
  </div>
  <div class="folder-tree" id="folderTree" oncontextmenu="rootFolderContext(event)"></div>
  <div class="stats" id="stats">0 notes</div>
</div>

<div class="main">
  <div class="toolbar">
    <button class="hamburger" onclick="toggleSidebar()" title="Menu">&#9776;</button>
    <select id="formatSelect" onchange="onFormatChange()">
      <option value="auto">Auto-detect</option>
      <option value="text">Plain Text</option>
      <option value="markdown">Markdown</option>
      <option value="json">JSON</option>
      <option value="xml">XML</option>
    </select>
    <button class="btn btn-sm btn-ghost" id="syncBtn" onclick="manualSync()" title="Sync to Gist">&#8645; Sync</button>
    <button class="btn btn-sm btn-ghost" id="exportBtn" onclick="exportVault()" title="Export">&#8615; Export</button>
    <button class="btn btn-sm btn-ghost" id="importBtn" onclick="importVault()" title="Import">&#8614; Import</button>
    <span class="toolbar-spacer"></span>
    <span class="sync-indicator" id="syncIndicator">
      <span class="sync-dot never"></span> <span id="syncLabel">Offline</span>
    </span>
    <button class="btn-icon" onclick="toggleTheme()" title="Toggle theme" id="themeBtn">&#9788;</button>
    <span id="detectedFormat" style="font-size:12px;color:var(--text2);"></span>
  </div>
  <div class="content-area">
    <div class="editor-pane">
      <div class="pane-header"><span>Editor</span><span id="charCount">0 chars</span></div>
      <textarea id="editor" placeholder="Write or paste your content here...&#10;&#10;Supports: Markdown, JSON, XML, plain text" oninput="onEditorInput()"></textarea>
    </div>
    <div class="preview-pane">
      <div class="pane-header">Preview</div>
      <div class="preview-content" id="preview">
        <div class="empty-state">
          <div class="empty-state-icon">&#128221;</div>
          <h2>No note selected</h2>
          <p>Create a new note or select one from the sidebar. Paste any content &mdash; Markdown, JSON, XML, or plain text.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="context-menu" id="contextMenu"></div>
<div id="modalContainer"></div>

function filterJSONTree(){var filter=document.getElementById("jsonFilter");var count=document.getElementById("filterCount");var container=document.getElementById("jsonTreeContainer");if(!filter||!container)return;var q=filter.value.toLowerCase().trim();var nodes=container.querySelectorAll(".json-node");var visible=0;nodes.forEach(function(n){var txt=n.textContent.toLowerCase();var match=txt.indexOf(q)>=0;if(!q){n.classList.remove("hidden");n.classList.remove("match-highlight");highlightMarks(n,"");if(n.querySelector(".json-toggle"))n.querySelector(".json-toggle").textContent=n.querySelector(".json-toggle").textContent.replace("\\u25bc","\\u25bc").replace("\\u25b6","\\u25b6");visible++;}else if(match){n.classList.remove("hidden");n.classList.add("match-highlight");highlightMarks(n,q);expandNode(n);visible++;}else{n.classList.add("hidden");n.classList.remove("match-highlight");}});if(count)count.textContent=q?(visible+" of "+nodes.length):"";if(!q)container.querySelectorAll(".json-preview").forEach(function(p){p.style.display="";});}

async function refreshFolderTree(){var folders=await dbGetAll("folders");var notes=await dbGetAll("notes");

  var q=searchQuery.toLowerCase();
  var filteredNotes=q?notes.filter(function(n){return (n.title||"").toLowerCase().includes(q)||(n.content||"").toLowerCase().includes(q);}):notes;
  var noteCounts={};notes.forEach(function(n){var fid=n.folderId||"__root__";noteCounts[fid]=(noteCounts[fid]||0)+1;});
  function buildTree(parentId,level){parentId=parentId||null;level=level||0;var children=folders.filter(function(f){return f.parentId===parentId;});
    var folderNotes=filteredNotes.filter(function(n){return (n.folderId||null)===parentId;});
    var html="";
    children.sort(function(a,b){return a.name.localeCompare(b.name);}).forEach(function(f){var cid=f.id;var isExp=expandedFolders.has(cid);
      var childCount=folders.filter(function(cf){return cf.parentId===cid;}).length;

        '<span class=tree-icon>'+(isExp?"\uD83D\uDCC2":"\uD83D\uDCC1")+'</span>'+
        '<span class=tree-name>'+escapeHtml(f.name)+'</span>'+
        (noteCount?'<span class=tree-badge>'+noteCount+'</span>':"")+
        '<span class=tree-actions>'+
        '<button class=btn-icon title="Add note" onclick="event.stopPropagation();createNoteInFolder(\''+cid+'\')">+</button>'+
        '<button class=btn-icon title="Add subfolder" onclick="event.stopPropagation();createSubfolder(\''+cid+'\')">\uD83D\uDCC1</button>'+
        '</span></div>';
      var childHtml=buildTree(cid,level+1);
      html+='<div class="tree-children'+(isExp?"":" collapsed")+'" id=tree-children-'+cid+'>'+childHtml+'</div>';
    });
    folderNotes.sort(function(a,b){return b.updatedAt-a.updatedAt;}).forEach(function(n){var fmt=n.format==="auto"?detectFormat(n.content):n.format;
      html+='<div class="tree-item'+(n.id===currentNoteId?" active":"")+'" id=tree-note-'+n.id+'" onclick="loadNote(\''+n.id+'\')" oncontextmenu="noteContext(event,\''+n.id+'\')">'+

        '<span class=tree-badge>'+fmt+'</span>'+
        '</div>';
    });
    return html;}
  tree.innerHTML=buildTree();
  var totalNotes=notes.length;var totalFolders=folders.length;
  stats.textContent=totalFolders+" folder"+(totalFolders!==1?"s":"")+" \u00B7 "+totalNotes+" note"+(totalNotes!==1?"s":"");}

// === ENCRYPTION MODULE ===
async function deriveKey(passphrase,salt,iterations,extractable){iterations=iterations||600000;extractable=extractable||false;var enc=new TextEncoder();
  var keyMaterial=await crypto.subtle.importKey("raw",enc.encode(passphrase),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:enc.encode(salt),iterations:iterations,hash:"SHA-256"},keyMaterial,{name:"AES-GCM",length:256},extractable,["encrypt","decrypt","wrapKey","unwrapKey"]);}

async function encryptAES(key,plaintext){var enc=new TextEncoder();var iv=crypto.getRandomValues(new Uint8Array(12));
  var ciphertext=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,enc.encode(plaintext));
  return{iv:Array.from(iv),ciphertext:Array.from(new Uint8Array(ciphertext))};}

async function decryptAES(key,data){var iv=new Uint8Array(data.iv);var ct=new Uint8Array(data.ciphertext);
  var plaintext=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
  return new TextDecoder().decode(plaintext);}

async function encryptAESString(key,plaintext){var d=await encryptAES(key,plaintext);return JSON.stringify(d);}
async function decryptAESString(key,json){return decryptAES(key,JSON.parse(json));}

async function wrapKey(wrappingKey,keyToWrap){var iv=crypto.getRandomValues(new Uint8Array(12));
  var wrapped=await crypto.subtle.wrapKey("raw",keyToWrap,wrappingKey,{name:"AES-GCM",iv:iv});
  return{iv:Array.from(iv),wrapped:Array.from(new Uint8Array(wrapped))};}

async function unwrapKey(wrappingKey,wrappedData){var iv=new Uint8Array(wrappedData.iv);
  var wrapped=new Uint8Array(wrappedData.wrapped);
  return crypto.subtle.unwrapKey("raw",wrapped,wrappingKey,{name:"AES-GCM",iv:iv},{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}

// === RECOVERY KEY ===
function generateRecoveryKey(){var words=[];var arr=new Uint16Array(12);crypto.getRandomValues(arr);
  for(var i=0;i<12;i++)words.push(BIP39[arr[i]%2048]);return words;}

async function deriveRecoveryKey(words){var s=await dbGet("settings","recovery_salt");var salt=s?s.value:"notevault-recovery";
  return deriveKey(words.join(" "),salt,100000,true);}

    '<input type=password id=setupPassphraseConfirm placeholder="Confirm passphrase" onkeydown="if(event.key===\'Enter\')startSetup()">'+
    '<div id=setupError style="color:var(--danger);font-size:13px;margin-bottom:8px;display:none;"></div>'+
    '<div class=modal-actions>'+

async function startSetup(){var pw=document.getElementById("setupPassphrase").value;

  if(pw.length<8){err.textContent="Passphrase must be at least 8 characters";err.style.display="";return;}
  if(pw!==confirm){err.textContent="Passphrases do not match";err.style.display="";return;}
  var salt=crypto.randomUUID();var words=generateRecoveryKey();
  await dbPut("settings",{key:"passphrase_salt",value:salt});
  var recoverySalt=crypto.randomUUID();
  await dbPut("settings",{key:"recovery_salt",value:recoverySalt});
  passphraseKey=await deriveKey(pw,salt);
  recoveryKey=await deriveRecoveryKey(words);
  var wrappedRK=await wrapKey(passphraseKey,recoveryKey);
  await dbPut("settings",{key:"recovery_key_encrypted",value:JSON.stringify(wrappedRK)});
  var hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw+":"+salt));
  await dbPut("settings",{key:"passphrase_hash",value:Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,"0");}).join("")});
  var verify=await encryptAESString(recoveryKey,"notevault-verify");

  showRecoveryWords(words);}

    '<p style="font-size:12px;color:var(--text3);">Warning: If you lose both your passphrase and recovery key, your data cannot be recovered.</p>'+
    '<div class=modal-actions>'+

function verifyRecoveryWords(){var modal=document.getElementById("modalContainer");
  modal.innerHTML='<div class=modal-overlay><div class=modal style="max-width:480px;">'+
    '<h2>Verify Recovery Key</h2>'+
    '<p>Enter the 12 recovery words in order to verify you\'ve saved them correctly.</p>'+
    '<textarea id=verifyWords rows=4 placeholder="Enter all 12 words separated by spaces" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();doVerifyRecovery()}"></textarea>'+
    '<div id=verifyError style="color:var(--danger);font-size:13px;margin-bottom:8px;display:none;"></div>'+
    '<div class=modal-actions>'+
    '<button class="btn btn-ghost" onclick="skipVerify()">Skip</button>'+
    '<button class=btn onclick="doVerifyRecovery()">Verify</button>'+
    '</div></div></div>';}

async function skipVerify(){await dbPut("settings",{key:"setup_complete",value:true});
  document.getElementById("modalContainer").innerHTML="";isLocked=false;await refreshFolderTree();updatePreview();showToast("Setup complete!");}

async function doVerifyRecovery(){var input=document.getElementById("verifyWords").value.trim().split(/\s+/);var err=document.getElementById("verifyError");
  if(input.length!==12){err.textContent="Please enter exactly 12 words";err.style.display="";return;}
  try{var testKey=await deriveRecoveryKey(input);var verifyEnc=await dbGet("settings","recovery_verify");
    var decrypted=await decryptAESString(testKey,verifyEnc.value);
    if(decrypted!=="notevault-verify"){err.textContent="Words do not match.";err.style.display="";return;}
    await dbPut("settings",{key:"setup_complete",value:true});
    document.getElementById("modalContainer").innerHTML="";isLocked=false;recoveryKey=testKey;
    await refreshFolderTree();updatePreview();showToast("Setup complete!");
  }catch(e){err.textContent="Words do not match: "+e.message;err.style.display="";}}

async function showUnlock(){var modal=document.getElementById("modalContainer");
  modal.innerHTML='<div class=modal-overlay><div class=modal>'+
    '<h2>Unlock NoteVault</h2>'+
    '<p>Enter your passphrase to unlock your notes.</p>'+
    '<input type=password id=unlockPassphrase placeholder="Enter passphrase" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doUnlock()">'+
    '<div id=unlockError style="color:var(--danger);font-size:13px;margin-bottom:8px;display:none;"></div>'+
    '<div class=modal-actions>'+
    '<button class="btn btn-ghost" onclick="showRecovery()">Forgot passphrase?</button>'+
    '<button class=btn onclick="doUnlock()">Unlock</button>'+
    '</div></div></div>';
  setTimeout(function(){var el=document.getElementById("unlockPassphrase");if(el)el.focus();},100);}

async function doUnlock(){var pw=document.getElementById("unlockPassphrase").value;var err=document.getElementById("unlockError");
  try{var salt=await dbGet("settings","passphrase_salt");var storedHash=await dbGet("settings","passphrase_hash");
    var key=await deriveKey(pw,salt.value);var hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw+":"+salt.value));
    var hashHex=Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
    if(hashHex!==storedHash.value){err.textContent="Incorrect passphrase";err.style.display="";return;}
    passphraseKey=key;var wrappedRK=await dbGet("settings","recovery_key_encrypted");
    recoveryKey=await unwrapKey(passphraseKey,JSON.parse(wrappedRK.value));
    var tokenEnc=await dbGet("settings","github_token_encrypted");
    if(tokenEnc){try{githubToken=await decryptAESString(recoveryKey,tokenEnc.value);}catch(_){githubToken=null;}}
    var gid=await dbGet("settings","gist_id");if(gid)gistId=gid.value;
    var se=await dbGet("settings","auto_sync");if(se)syncEnabled=se.value;
    document.getElementById("modalContainer").innerHTML="";isLocked=false;
    await refreshFolderTree();updatePreview();updateSyncIndicator();showToast("Unlocked");
  }catch(e){err.textContent="Error unlocking: "+e.message;err.style.display="";}}

async function showRecovery(){var modal=document.getElementById("modalContainer");
  modal.innerHTML='<div class=modal-overlay><div class=modal style="max-width:560px;">'+
    '<h2>Recover Your Notes</h2>'+
    '<p>Enter your 12 recovery words to regain access.</p>'+
    '<textarea id=recoveryInput rows=4 placeholder="Enter all 12 words separated by spaces" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();doRecovery()}"></textarea>'+
    '<div id=recoveryError style="color:var(--danger);font-size:13px;margin-bottom:8px;display:none;"></div>'+
    '<div class=modal-actions>'+
    '<button class="btn btn-ghost" onclick="showUnlock()">Back</button>'+
    '<button class=btn onclick="doRecovery()">Recover</button>'+
    '</div></div></div>';}

async function doRecovery(){var input=document.getElementById("recoveryInput").value.trim().split(/\s+/);var err=document.getElementById("recoveryError");
  if(input.length!==12){err.textContent="Please enter exactly 12 words";err.style.display="";return;}
  try{var testKey=await deriveRecoveryKey(input);var verifyEnc=await dbGet("settings","recovery_verify");
    var decrypted=await decryptAESString(testKey,verifyEnc.value);
    if(decrypted!=="notevault-verify"){err.textContent="Invalid recovery words.";err.style.display="";return;}
    recoveryKey=testKey;showNewPassphrase();}catch(e){err.textContent="Invalid recovery words: "+e.message;err.style.display="";}}

function showNewPassphrase(){var modal=document.getElementById("modalContainer");
  modal.innerHTML='<div class=modal-overlay><div class=modal>'+
    '<h2>Set New Passphrase</h2>'+
    '<p>Recovery successful! Set a new passphrase.</p>'+
    '<input type=password id=newPassphrase placeholder="New passphrase" onkeydown="if(event.key===\'Enter\')document.getElementById(\'newPassphraseConfirm\').focus()">'+
    '<input type=password id=newPassphraseConfirm placeholder="Confirm new passphrase" onkeydown="if(event.key===\'Enter\')setNewPassphrase()">'+
    '<div id=newPassError style="color:var(--danger);font-size:13px;margin-bottom:8px;display:none;"></div>'+
    '<div class=modal-actions>'+
    '<button class=btn onclick="setNewPassphrase()">Save</button>'+
    '</div></div></div>';}

async function setNewPassphrase(){var pw=document.getElementById("newPassphrase").value;
  var confirm=document.getElementById("newPassphraseConfirm").value;var err=document.getElementById("newPassError");
  if(pw.length<8){err.textContent="Passphrase must be at least 8 characters";err.style.display="";return;}
  if(pw!==confirm){err.textContent="Passphrases do not match";err.style.display="";return;}
  var salt=crypto.randomUUID();passphraseKey=await deriveKey(pw,salt);
  var wrappedRK=await wrapKey(passphraseKey,recoveryKey);
  await dbPut("settings",{key:"passphrase_salt",value:salt});
  await dbPut("settings",{key:"recovery_key_encrypted",value:JSON.stringify(wrappedRK)});
  var hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw+":"+salt));
  await dbPut("settings",{key:"passphrase_hash",value:Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,"0");}).join("")});
  if(githubToken){var encTok=await encryptAESString(recoveryKey,githubToken);await dbPut("settings",{key:"github_token_encrypted",value:encTok});}
  document.getElementById("modalContainer").innerHTML="";isLocked=false;
  await refreshFolderTree();updatePreview();showToast("Passphrase updated");}

async function changePassphrase(){var pw=prompt("Enter current passphrase:");if(!pw)return;
  try{var salt=await dbGet("settings","passphrase_salt");var storedHash=await dbGet("settings","passphrase_hash");
    var key=await deriveKey(pw,salt.value);var hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw+":"+salt.value));
    var hashHex=Array.from(new Uint8Array(hash)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
    if(hashHex!==storedHash.value){showToast("Incorrect passphrase",true);return;}
    var newPw=prompt("Enter new passphrase:");if(!newPw||newPw.length<8){showToast("Passphrase too short",true);return;}
    var confirm2=prompt("Confirm new passphrase:");if(newPw!==confirm2){showToast("Passphrases do not match",true);return;}
    var newSalt=crypto.randomUUID();var newKey=await deriveKey(newPw,newSalt);
    var wrappedRK=await wrapKey(newKey,recoveryKey);
    await dbPut("settings",{key:"passphrase_salt",value:newSalt});
    await dbPut("settings",{key:"recovery_key_encrypted",value:JSON.stringify(wrappedRK)});
    var newHash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(newPw+":"+newSalt));
    await dbPut("settings",{key:"passphrase_hash",value:Array.from(new Uint8Array(newHash)).map(function(b){return b.toString(16).padStart(2,"0");}).join("")});
    passphraseKey=newKey;showToast("Passphrase changed");
  }catch(e){showToast("Error: "+e.message,true);}}

// === GITHUB GIST SYNC ===
async function manualSync(){if(!githubToken){showToast("Set up GitHub token in Settings first",true);return;}
  syncInProgress=true;updateSyncIndicator();
  try{if(!gistId){await firstSync();}else{await syncToGist();}}finally{syncInProgress=false;updateSyncIndicator();}}

async function firstSync(){var vault=await getVaultJSON();var plaintext=JSON.stringify(vault);
  var encrypted=await encryptAES(recoveryKey,plaintext);
  var blob=JSON.stringify({v:1,iv:encrypted.iv,data:encrypted.ciphertext});
  var resp=await fetch("https://api.github.com/gists",{method:"POST",headers:{Authorization:"token "+githubToken,"Content-Type":"application/json",Accept:"application/vnd.github.v3+json"},
    body:JSON.stringify({description:"NoteVault encrypted vault",public:false,files:{"vault.enc":{content:blob}}})});
  if(!resp.ok){var ej=await resp.json();showToast("Sync failed: "+ej.message,true);return;}
  var json=await resp.json();gistId=json.id;await dbPut("settings",{key:"gist_id",value:gistId});
  await dbPut("settings",{key:"last_synced_at",value:Date.now()});updateSyncIndicator();showToast("Synced!");}

async function syncToGist(){try{var resp=await fetch("https://api.github.com/gists/"+gistId,{headers:{Authorization:"token "+githubToken,Accept:"application/vnd.github.v3+json"}});
    if(!resp.ok){if(resp.status===404){gistId=null;await dbPut("settings",{key:"gist_id",value:null});return firstSync();}
      showToast("Sync pull failed",true);return;}
    var json=await resp.json();var filename=Object.keys(json.files)[0];var content=json.files[filename].content;
    if(content){try{var parsed=JSON.parse(content);var decrypted=await decryptAES(recoveryKey,{iv:parsed.iv,ciphertext:parsed.data});
      var vault=JSON.parse(decrypted);await mergeVault(vault);}catch(e){showToast("Sync decrypt failed: wrong passphrase?",true);return;}}
    var vault2=await getVaultJSON();var plaintext=JSON.stringify(vault2);
    var encrypted=await encryptAES(recoveryKey,plaintext);
    var blob=JSON.stringify({v:1,iv:encrypted.iv,data:encrypted.ciphertext});
    var patchResp=await fetch("https://api.github.com/gists/"+gistId,{method:"PATCH",headers:{Authorization:"token "+githubToken,"Content-Type":"application/json",Accept:"application/vnd.github.v3+json"},
      body:JSON.stringify({files:{[filename]:{content:blob}}})});
    if(!patchResp.ok){showToast("Sync push failed",true);return;}
    await dbPut("settings",{key:"last_synced_at",value:Date.now()});updateSyncIndicator();showToast("Synced!");
  }catch(e){showToast("Sync error: "+e.message,true);}}

async function getVaultJSON(){var folders=await dbGetAll("folders");var notes=await dbGetAll("notes");
  return{version:1,folders:folders,notes:notes};}

async function mergeVault(vault){if(!vault||!vault.folders||!vault.notes)return;
  var localFolders=await dbGetAll("folders");var localNotes=await dbGetAll("notes");
  var localFolderMap={};localFolders.forEach(function(f){localFolderMap[f.id]=f;});
  var localNoteMap={};localNotes.forEach(function(n){localNoteMap[n.id]=n;});
  for(var i=0;i<vault.folders.length;i++){var f=vault.folders[i];var local=localFolderMap[f.id];
    if(!local||f.updatedAt>local.updatedAt)await dbPut("folders",f);}
  for(var j=0;j<vault.notes.length;j++){var n=vault.notes[j];var local2=localNoteMap[n.id];
    if(!local2||n.updatedAt>local2.updatedAt)await dbPut("notes",n);}
  await refreshFolderTree();}

function updateSyncIndicator(){var dot=document.querySelector("#syncIndicator .sync-dot");var label=document.getElementById("syncLabel");
  if(!dot||!label)return;
  if(syncInProgress){dot.className="sync-dot syncing";label.textContent="Syncing...";return;}
  if(!githubToken||!gistId){dot.className="sync-dot never";label.textContent="Offline";return;}
  if(syncEnabled){dot.className="sync-dot synced";label.textContent="Auto";}else{dot.className="sync-dot never";label.textContent="Manual";}
  dbGet("settings","last_synced_at").then(function(s){if(s&&s.value){var ago=Math.round((Date.now()-s.value)/60000);label.textContent=(syncEnabled?"Auto":"Manual")+" \u00B7 "+(ago<1?"just now":ago+"m ago");}}).catch(function(){});}

// === SETTINGS ===
async function openSettings(){var modal=document.getElementById("modalContainer");
  var tokSet=!!githubToken;var gidSet=!!gistId;
  modal.innerHTML='<div class=modal-overlay><div class=modal style="max-width:520px;">'+
    '<h2>Settings</h2>'+
    '<div class=settings-row><label>GitHub Token</label>'+
    '<button class="btn btn-sm btn-ghost" onclick="setGithubToken()">'+(tokSet?"Change":"Set")+'</button></div>'+
    '<div class=settings-row><label>Gist ID</label><span style="font-size:12px;color:var(--text2);">'+(gidSet?gistId:"Not synced")+'</span></div>'+
    '<div class=settings-row><label>Sync Status</label><span style="font-size:12px;color:var(--text2);">'+(syncEnabled?"Enabled":"Disabled")+'</span></div>'+
    '<div class=settings-row><label>Auto-sync</label>'+
    '<button class="btn btn-sm btn-ghost" onclick="toggleAutoSync()">'+(syncEnabled?"On":"Off")+'</button></div>'+
    '<div class=settings-row><label>Export vault</label>'+
    '<button class="btn btn-sm btn-ghost" onclick="exportVault()">JSON</button>'+
    '<button class="btn btn-sm btn-ghost" onclick="exportEncryptedVault()">Encrypted</button></div>'+
    '<div class=settings-row><label>Import vault</label>'+
    '<button class="btn btn-sm btn-ghost" onclick="importVault()">JSON</button></div>'+
    '<div class=settings-row><label>Change passphrase</label>'+
    '<button class="btn btn-sm btn-ghost" onclick="changePassphrase()">Change</button></div>'+
    '<div class=modal-actions>'+
    '<button class=btn onclick="document.getElementById(\'modalContainer\').innerHTML=\'\'">Close</button>'+
    '</div></div></div>';}

async function setGithubToken(){var token=prompt("Enter GitHub personal access token (classic, 'gist' scope):");if(!token||!token.trim())return;
  githubToken=token.trim();var encTok=await encryptAESString(recoveryKey,githubToken);
  await dbPut("settings",{key:"github_token_encrypted",value:encTok});showToast("Token saved");}

async function toggleAutoSync(){syncEnabled=!syncEnabled;await dbPut("settings",{key:"auto_sync",value:syncEnabled});
  updateSyncIndicator();openSettings();showToast("Auto-sync "+(syncEnabled?"on":"off"));}

function scheduleAutoSync(){if(!syncEnabled||!githubToken||!gistId)return;clearTimeout(autoSyncTimer);autoSyncTimer=setTimeout(function(){if(currentNoteId)saveCurrentNote();manualSync();},3000);}

// === EXPORT / IMPORT ===
async function exportVault(){var vault=await getVaultJSON();var blob=new Blob([JSON.stringify(vault,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="notevault-export-"+new Date().toISOString().slice(0,10)+".json";
  a.click();URL.revokeObjectURL(url);showToast("Exported");}

async function exportEncryptedVault(){if(!recoveryKey){showToast("Unlock first",true);return;}
  var vault=await getVaultJSON();var plaintext=JSON.stringify(vault);
  var encrypted=await encryptAES(recoveryKey,plaintext);
  var blob=new Blob([JSON.stringify({v:1,iv:encrypted.iv,data:encrypted.ciphertext})],{type:"application/json"});
  var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="notevault-encrypted-"+new Date().toISOString().slice(0,10)+".json";
  a.click();URL.revokeObjectURL(url);showToast("Encrypted export saved");}

function importVault(){var input=document.createElement("input");input.type="file";input.accept=".json";
  input.onchange=async function(){var file=input.files[0];if(!file)return;
    var text=await file.text();try{var data=JSON.parse(text);
      if(data.v&&data.iv&&data.data){if(!recoveryKey){showToast("Unlock first to import encrypted vault",true);return;}
        var decrypted=await decryptAES(recoveryKey,{iv:data.iv,ciphertext:data.data});
        await mergeVault(JSON.parse(decrypted));showToast("Encrypted vault imported");
      }else{await mergeVault(data);showToast("Vault imported");}
    }catch(e){showToast("Invalid file: "+e.message,true);}};
  input.click();}

// === KEYBOARD SHORTCUTS ===
document.addEventListener("keydown",function(e){if(isLocked)return;
  if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();if(currentNoteId)saveCurrentNote();}
  if((e.ctrlKey||e.metaKey)&&e.key==="n"){e.preventDefault();createNote();}
  if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key==="F"){e.preventDefault();createRootFolder();}
  if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();document.getElementById("searchInput").focus();}
});

// === INIT ===
async function init(){await openDB();await initTheme();var autoSync=await dbGet("settings","auto_sync");if(autoSync)syncEnabled=autoSync.value;
  if(location.protocol!=="file:"){if("serviceWorker"in navigator){try{await navigator.serviceWorker.register("sw.js");}catch(e){}}}
  var setup=await isSetup();
  if(!setup){await showSetup();}else{await showUnlock();}
  document.addEventListener("click",function(e){var menu=document.getElementById("contextMenu");
    if(menu&&!menu.contains(e.target))menu.style.display="none";});}

init();
</script>
